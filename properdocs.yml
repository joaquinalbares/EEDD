site_name: Entornos de Desarrollo - IES Los Albares

nav:
  - HOME: https://joaquinalbares.github.io/
  - GUÍA DEL MÓDULO: index.md
  - UT01:
    - CONTENIDOS: ut01-teoria-del-software/teoria/ut01.md
    - PRÁCTICA 01: ut01-teoria-del-software/practicas/practica01.md
  - UT02:
    - CONTENIDOS: ut02-entornos-integrados-ide/teoria/ut02.md
    - PRÁCTICA 01: ut02-entornos-integrados-ide/practicas/practica01.md
    - PRÁCTICA 02: ut02-entornos-integrados-ide/practicas/practica02.md
  - UT03:
    - PRÁCTICA 01: ut03-pruebas/practicas/practica01.md

theme:
  name: readthedocs
  locale: es

markdown_extensions:
  - markdown.extensions.tables
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.arithmatex
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML
  - js/copy-button.js

extra_css:
  - css/estilo.css