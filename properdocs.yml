site_name: Entornos de Desarrollo - IES Los Albares

nav:
  - HOME: https://joaquinalbares.github.io/
  - GUÍA DEL MÓDULO: index.md
  - UT01:
    - CONTENIDOS: ut01.md
    - EJ. DE CLASE: practicas/ut01.md
  - UT02:
    - CONTENIDOS: ut02.md
    - EJ. DE CLASE: practicas/ut02.md
  - UT03:
    - EJ. DE CLASE: practicas/ut03.md

theme:
  name: readthedocs
  locale: es

markdown_extensions:
  - markdown.extensions.tables
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.arithmatex
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML
  - js/copy-button.js

extra_css:
  - css/estilo.css